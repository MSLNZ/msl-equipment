name: CI

on: [push, pull_request]

env:
  PY_COLORS: 1
  COLUMNS: 110

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install locales (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y language-pack-en language-pack-de
      - name: Install libusb-1.0 (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z -OutFile libusb.7z
          7z e libusb.7z -oC:\Windows\System32 VS2022\MS64\dll\libusb-1.0.dll
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Run tests
        run: uv run --all-packages --with pytest-rerunfailures --python ${{ matrix.python-version }} --no-dev --group test -- pytest --reruns 5

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: '3.14'
      - name: Spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          incremental_files_only: false
      - name: Linting
        run: uv run --all-packages -- ruff check --force-exclude --no-fix .
      - name: Formatting
        run: uv run --all-packages -- ruff format --force-exclude --check .
      - name: Typing:BasedPyright
        run: uv run --all-packages -- basedpyright .
      - name: Typing:MyPy
        run: uv run --all-packages -- mypy .
